<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Attendance - Instructor</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap" id="login-view" hidden>
    <div class="public-card">
      <h1>Instructor sign in</h1>
      <p class="muted">Create sessions, show the QR code and review attendance.</p>
      <div id="login-error"></div>
      <form id="login-form">
        <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn block" type="submit">Sign in</button>
      </form>
      <p class="muted small" style="margin-top:1rem">Students do not sign in. They scan the QR code shown in class.</p>
    </div>
  </div>

  <div class="shell" id="shell" hidden>
    <nav class="side" aria-label="Main">
      <a class="brand" href="#/dashboard">QR Attendance<small>EF101-P10</small></a>
      <a class="nav" data-nav="dashboard" href="#/dashboard">Dashboard</a>
      <a class="nav" data-nav="courses" href="#/courses">Courses &amp; students</a>
      <a class="nav" data-nav="sessions" href="#/sessions">Sessions</a>
      <a class="nav" data-nav="reports" href="#/reports">Reports</a>
      <span class="spacer"></span>
      <a class="nav" id="logout" href="#">Log out</a>
    </nav>
    <main class="main">
      <div id="flash" aria-live="polite"></div>
      <div id="app"></div>
    </main>
  </div>

  <script src="/js/vendor/qrcode.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
