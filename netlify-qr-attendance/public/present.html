<html lang="en">
<head>

  <title>Scan to mark attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="projector">

  <script src="/js/vendor/qrcode.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/present.js"></script>
